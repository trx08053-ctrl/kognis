# Обновления зависимостей: встроено в GitHub, работает без установки приложений. Каждое обновление — PR,
# его проверяет CI; merge — решение человека. Мелкие обновления группируются в один PR в неделю.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
