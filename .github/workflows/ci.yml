# CI — источник истины: та же команда, что локально. Файл защищён.
name: ci
on:
  push: # все ветки: ветка задачи проверяется до переноса в main (just land)
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover и no-weakening сравнивают с main
      - uses: jdx/mise-action@v5
      - run: uv sync --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      # e2e и скриншоты; Docker на раннере есть — интеграция с PostgreSQL выполняется, не пропускается
      - run: uv run --locked playwright install --with-deps chromium
      # наборы правил Semgrep и база уязвимостей для проверок sast/deps
      - run: python3 scripts/check_security.py update
      - run: python3 scripts/verify.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence
          path: .evidence/
          include-hidden-files: true
      - run: osv-scanner scan source --lockfile uv.lock --lockfile frontend/pnpm-lock.yaml

  # Развёртывание проверяется по-настоящему: образ из коммита → PostgreSQL → миграции → /health
  stage:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # trivy для сканирования образа в stage
      - run: python3 scripts/web.py stage
      - run: python3 scripts/web.py status
      # DAST: OWASP ZAP baseline против работающего staging; правила — .zap-rules.tsv (защищён)
      - run: |
          mkdir -p zap && cp .zap-rules.tsv zap/ && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:18000 -c .zap-rules.tsv -I
      - if: always()
        run: python3 scripts/web.py down
