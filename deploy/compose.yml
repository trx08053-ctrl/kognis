# Развёртывание: PostgreSQL + приложение. Запускается через `just stage` / `just deploy` (scripts/web.py).
# логи контейнеров ротируются: без этого за месяцы работы они занимают весь диск сервера
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  app:
    image: kognis:${IMAGE_TAG:?}
    # секреты и настройки приложения окружения: .deploy/<env>.app.env (права 600, не в git; см. web.py)
    env_file:
      - path: ../.deploy/${DEPLOY_ENV:-staging}.app.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-18000}:8000"
    restart: unless-stopped
    logging: *logging
volumes:
  pgdata:
