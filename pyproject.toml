[project]
name = "kognis"
version = "0.1.0"
description = "Дневник переживаний с ИИ-анализом по направлениям психологии и игровыми квестами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
]

[project.scripts]
kognis = "kognis.web:main"

[dependency-groups]
dev = [
    "ruff>=0.13",
    "basedpyright>=1.30",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "diff-cover>=10.0",
    "mutmut>=3.8",
    "import-linter>=2.5",
    "httpx2>=2.13",
    "playwright>=1.63",
    "axe-playwright-python>=0.1.8",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kognis"]

# --- Проверки. Файл защищён: изменения только с одобрения человека. ---

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PL"]
# RUF001-003 (confusable unicode) ложно срабатывают на кириллицу в строках и docstring
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603"]
"migrations/**" = ["INP001"]
"scripts/**" = ["S603", "S607", "T201"]
".claude/hooks/**" = ["S603", "S607", "T201"]

[tool.basedpyright]
include = ["src", "tests", "scripts", ".claude/hooks", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Не добавлять [tool.pyright]: basedpyright предпочтёт его и потеряет эти настройки.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --strict-markers --cov=kognis --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=80"
markers = [
    "integration: реальные внешние зависимости (БД, сеть, контейнеры) — docs/TESTING.md",
    "e2e: сквозные пользовательские сценарии",
    "acceptance(task, ac): приёмочный сценарий для критерия ACn задачи — docs/TESTING.md",
    "migration: миграция на данных прошлой версии схемы — docs/EVOLUTION.md",
    "security(kind, target): проверка безопасности, напр. security(\"idor\", \"GET /api/x/{id}\") — docs/SECURITY.md",
]

# Мутационное тестирование (scripts/check_mutation.py): копия пакета в mutants/, мутанты — только изменённых функций
[tool.mutmut]
paths_to_mutate = ["src/kognis/"]
tests_dir = ["tests/"]
also_copy = ["alembic.ini", "migrations/", "security/", "frontend/dist/"]
pytest_add_cli_args = ["-m", "not e2e and not integration", "--no-cov", "-q", "-p", "no:cacheprovider"]
